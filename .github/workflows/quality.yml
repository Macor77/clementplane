name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Contrôle hebdomadaire : lundi matin
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_DOSSIER_ENABLED: 'true'
      VITE_DOSSIER_API: https://dossier.example.invalid
      VITE_GOOGLE_CALENDAR_ENABLED: true
      VITE_MICROSOFT_CALENDAR_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Test personal mission SQL and RLS
        run: npm run test:personal-sql

      - name: Test calendar SQL and security
        run: node scripts/testing/calendar-sync-sql.mjs

      - name: Test Microsoft calendar SQL and security
        run: node scripts/testing/microsoft-calendar-sql.mjs

      - name: Test manual revalidation SQL and security
        run: node scripts/testing/manual-revalidation-sql.mjs

      - name: Test trainer activity SQL and privacy
        run: npm run test:activity-sql

      - name: Prepare isolated dossier integration tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify dossier permissions and lifecycle on a disposable PostgreSQL instance
        run: |
          python -m pip install -r services/dossier/requirements.txt -r services/dossier/requirements-validator.txt pgserver==0.1.4
          python services/dossier/tests/acceptance.py

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify connected organization sharing and revocation on a disposable stack
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/trainer-professional-dossier'
        run: python services/dossier/tests/organization_browser.py

      - name: Run PWA browser test
        run: npx playwright test tests/e2e/specs/05-pwa-shell.spec.js tests/e2e/specs/06-personal-missions-ui.spec.js tests/e2e/specs/08-google-calendar-ui.spec.js tests/e2e/specs/09-availability-recovery.spec.js tests/e2e/specs/10-form-tab-return.spec.js tests/e2e/specs/11-manual-revalidation.spec.js tests/e2e/specs/12-new-tab-navigation.spec.js tests/e2e/specs/13-microsoft-calendar-ui.spec.js tests/e2e/specs/14-trainer-activity.spec.js tests/e2e/specs/15-trainer-expenses.spec.js tests/e2e/specs/16-partial-attendance.spec.js tests/e2e/specs/17-activity-help.spec.js tests/e2e/specs/18-separate-attendance.spec.js tests/e2e/specs/19-trainer-statistics.spec.js tests/e2e/specs/20-professional-dossier.spec.js

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Keep fictitious browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build reviewed source archive candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.7.0-mobile-statistics'
        run: python3 scripts/testing/archive-sprint.py HEAD Clementplane_v1.7.0_Candidate.zip

      - name: Keep source archive and checksum
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v1.7.0-mobile-statistics'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v1.7.0-source-candidate
          path: |
            Clementplane_v1.7.0_Candidate.zip
            Clementplane_v1.7.0_Candidate.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Check out the exact V1.8.0 draft for the source archive
        if: "!cancelled() && github.event_name == 'pull_request' && github.head_ref == 'feature/trainer-professional-dossier'"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: dossier-candidate
          persist-credentials: false
      - name: Verify V1.8.0 candidate source archive
        if: "!cancelled() && github.event_name == 'pull_request' && github.head_ref == 'feature/trainer-professional-dossier'"
        working-directory: dossier-candidate
        run: python scripts/testing/archive-sprint.py HEAD ../Clementplane_v1.8.0_Candidate.zip
      - name: Keep V1.8.0 draft archive and checksum
        if: "!cancelled() && github.event_name == 'pull_request' && github.head_ref == 'feature/trainer-professional-dossier'"
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v1.8.0-dossier-candidate
          path: |
            Clementplane_v1.8.0_Candidate.zip
            Clementplane_v1.8.0_Candidate.zip.sha256
          retention-days: 30
          if-no-files-found: error
