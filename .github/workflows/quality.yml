name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Contrôle hebdomadaire : lundi matin
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_GOOGLE_CALENDAR_ENABLED: true
      VITE_MICROSOFT_CALENDAR_ENABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Test personal mission SQL and RLS
        run: npm run test:personal-sql

      - name: Test calendar SQL and security
        run: node scripts/testing/calendar-sync-sql.mjs

      - name: Test Microsoft calendar SQL and security
        run: node scripts/testing/microsoft-calendar-sql.mjs

      - name: Test manual revalidation SQL and security
        run: node scripts/testing/manual-revalidation-sql.mjs

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PWA browser test
        run: npx playwright test tests/e2e/specs/05-pwa-shell.spec.js tests/e2e/specs/06-personal-missions-ui.spec.js tests/e2e/specs/08-google-calendar-ui.spec.js tests/e2e/specs/09-availability-recovery.spec.js tests/e2e/specs/10-form-tab-return.spec.js tests/e2e/specs/11-manual-revalidation.spec.js tests/e2e/specs/12-new-tab-navigation.spec.js tests/e2e/specs/13-microsoft-calendar-ui.spec.js

      - name: Keep fictitious browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
