server {
    listen 80;
    access_log off;
    add_header Access-Control-Allow-Origin http://127.0.0.1:4173 always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, accept-profile, content-profile, x-supabase-api-version, prefer" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    if ($request_method = OPTIONS) { return 204; }
    location /auth/v1/ { proxy_pass http://auth:9999/; }
    location /rest/v1/ { proxy_pass http://rest:3000/; }
    location / { return 404; }
}
