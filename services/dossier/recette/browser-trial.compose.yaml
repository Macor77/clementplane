# Disposable browser fixture. Only loopback ports are published, with no mail worker.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: browser-fixture-only
    command: [postgres, -c, log_min_error_statement=panic]
    ports: ["127.0.0.1::5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes:
      - ./browser-principals.sql:/docker-entrypoint-initdb.d/01-principals.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 45
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on: {db: {condition: service_healthy}}
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:fixture-auth@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:4173
      GOTRUE_SITE_URL: http://127.0.0.1:4173
      GOTRUE_JWT_SECRET: ${BROWSER_TRIAL_JWT:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
  rest:
    image: postgrest/postgrest:v14.18
    depends_on: {db: {condition: service_healthy}}
    environment:
      PGRST_DB_URI: postgres://fixture_rest:fixture-rest@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${BROWSER_TRIAL_JWT:?}
  gateway:
    image: nginx:stable-alpine
    depends_on: [auth, rest]
    ports: ["127.0.0.1::80"]
    volumes: ["./browser-gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
